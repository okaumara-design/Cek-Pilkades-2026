
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#163a6e">
<title>Pasang Cek Pilkades 2026</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
  background: #f1f5f9;
  font-family: Arial, sans-serif;
  color: #163a6e;
}

.card {
  width: 100%;
  max-width: 420px;
  background: white;
  border-radius: 20px;
  padding: 30px 24px;
  text-align: center;
  box-shadow: 0 8px 30px #163a6e18;
}

.icon {
  font-size: 52px;
  margin-bottom: 12px;
}

h2 { margin: 8px 0; }

p {
  color: #64748b;
  line-height: 1.6;
  font-size: 14px;
}

button, .open {
  display: block;
  width: 100%;
  padding: 15px;
  border: 0;
  border-radius: 10px;
  background: #0d9488;
  color: white;
  font-size: 15px;
  font-weight: bold;
  text-decoration: none;
  cursor: pointer;
  margin-top: 15px;
}

.open { background: #163a6e; }

#status {
  margin-top: 16px;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="card">
  <div class="icon">🗳️</div>

  <h2>CEK PILKADES 2026</h2>

  <p>
    Aplikasi resmi layanan pencarian data pemilih
    Pilkades Desa Sumurgintung Tahun 2026.
  </p>

  <button id="installBtn" hidden>
    PASANG APLIKASI
  </button>

  <a class="open"
     href="https://sites.google.com/view/pilkadessumurgintung2026/cekdatapemilih">
     BUKA PENCARIAN DATA PEMILIH
  </a>

  <div id="status">Menyiapkan aplikasi...</div>
</div>

<script>
const installBtn = document.getElementById("installBtn");
const statusText = document.getElementById("status");

const alamatGoogleSites =
  "https://sites.google.com/view/pilkadessumurgintung2026/cekdatapemilih";

let deferredPrompt = null;

const modeAplikasi =
  window.matchMedia("(display-mode: standalone)").matches ||
  window.navigator.standalone === true;

// Jika dibuka dari ikon aplikasi
if (modeAplikasi) {
  window.location.replace(alamatGoogleSites);
} else {

  // Daftarkan service worker
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./service-worker.js")
      .catch(error => console.log(error));
  }

  // Deteksi apakah Chrome menawarkan instalasi
  window.addEventListener("beforeinstallprompt", (event) => {
    event.preventDefault();
    deferredPrompt = event;

    installBtn.hidden = false;
    statusText.textContent = "Aplikasi siap dipasang.";
  });

  // Tombol pemasangan
  installBtn.addEventListener("click", async () => {

    if (!deferredPrompt) {
      statusText.textContent =
        "Silakan buka menu Chrome (⋮), lalu pilih Instal aplikasi atau Tambahkan ke layar utama.";
      return;
    }

    const promptEvent = deferredPrompt;
    deferredPrompt = null;

    await promptEvent.prompt();

    const result = await promptEvent.userChoice;

    if (result.outcome === "accepted") {
      statusText.textContent =
        "Aplikasi sedang dipasang.";
    } else {
      statusText.textContent =
        "Pemasangan dibatalkan.";
    }

    installBtn.hidden = true;
  });

  // Ketika aplikasi berhasil dipasang
  window.addEventListener("appinstalled", () => {
    installBtn.hidden = true;
    statusText.textContent = "Aplikasi berhasil dipasang.";
  });

  statusText.textContent =
    "Menunggu kesiapan instalasi aplikasi...";
}
</script>

</body>
</html>
